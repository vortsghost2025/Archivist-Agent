<!-- GraphContextPanel Component – Accessibility Enhancements -->
<div id="graph-context-panel" role="region" aria-labelledby="graph-context-title" class="large-control-label">
  <h2 id="graph-context-title">What am I looking at?</h2>
  <p class="text-muted">
    This panel provides context for the currently displayed graph snapshot.
    Use the controls below to navigate between snapshots, adjust the zoom level,
    and toggle motion preferences.
  </p>
  <div class="snapshot-controls">
    <label for="snapshot-select" class="large-control-label">Snapshot:</label>
    <select id="snapshot-select" aria-label="Select snapshot">
      <option value="latest">Latest</option>
      <!-- Options will be populated dynamically -->
    </select>
    <label for="zoom-range" class="large-control-label">Zoom:</label>
    <input type="range" id="zoom-range" min="0.5" max="2" step="0.01" value="1" aria-label="Zoom level" />
    <label class="large-control-label" for="reduced-motion">
      <input type="checkbox" id="reduced-motion" aria-checked="false" />
      Reduce motion
    </label>
  </div>
</div>
