[package]
name = "archivist-agent"
version = "0.2.0"
description = "Turn file chaos into readable structure"
authors = ["Archivist Agent"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "archivist_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1"
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "alloc"] }
rsa = { version = "0.9", features = ["pem"] }
base64 = "0.22"
pkcs8 = { version = "0.10", features = ["pem", "alloc"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
