name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # TypeScript baseline: advisory when present, warning when absent
      - name: TypeScript type-check (governance scripts)
        id: typescript
        if: hashFiles('tsconfig.ci.json') != ''
        continue-on-error: true
        run: npx tsc -p tsconfig.ci.json --noEmit

      - name: TypeScript type-check advisory (tsconfig.ci.json missing)
        if: hashFiles('tsconfig.ci.json') == ''
        run: |
          Write-Host "::warning::tsconfig.ci.json not found on this branch. TypeScript baseline check skipped."
          "typescript_result=missing" >> $env:GITHUB_OUTPUT

      - name: TypeScript reporting
        if: always() && steps.typescript.outcome != 'skipped'
        run: |
          if ("${{ steps.typescript.outcome }}" -eq "failure") {
            Write-Host "::warning::TypeScript baseline check failed. This is advisory until baseline errors are repaired."
            "typescript_result=failure" >> $env:GITHUB_OUTPUT
          } else {
            "typescript_result=success" >> $env:GITHUB_OUTPUT
          }

      # Recovery suite: advisory on hosted runners (private Tailscale unreachable)
      - name: Run recovery test suite
        id: recovery
        continue-on-error: true
        run: node ./scripts/recovery-test-suite.js

      - name: Recovery suite reporting
        if: always()
        run: |
          $outcome = "${{ steps.recovery.outcome }}"
          if ($outcome -eq "failure") {
            Write-Host "::warning::Recovery suite had failures. Live integration checks (lane_liveness, multi_source_consistency) require private Tailscale network and are expected to fail on hosted GitHub runners."
          }
          "recovery_result=$outcome" >> $env:GITHUB_OUTPUT

      # Required offline validation: always runs
      - name: Run health check
        id: health
        if: always()
        run: node ./scripts/health-check.js

      - name: Run schema validation (all lanes)
        id: schema
        if: always()
        run: node ./scripts/validate-schema.js --all

      # Final enforcement: fail on health/schema failures, not on advisory failures
      - name: Enforce required validation
        if: always()
        run: |
          Write-Host "=== CI Validation Summary ==="
          Write-Host "TypeScript: ${{ steps.typescript.outcome }}"
          Write-Host "Recovery: ${{ steps.recovery.outcome }}"
          Write-Host "Health: ${{ steps.health.outcome }}"
          Write-Host "Schema: ${{ steps.schema.outcome }}"
          Write-Host ""
          $failed = $false
          if ("${{ steps.health.outcome }}" -eq "failure") {
            Write-Host "::error::Health check failed"
            $failed = $true
          }
          if ("${{ steps.schema.outcome }}" -eq "failure") {
            Write-Host "::error::Schema validation failed"
            $failed = $true
          }
          if ("${{ steps.typescript.outcome }}" -eq "failure") {
            Write-Host "::warning::TypeScript baseline failed (advisory)"
          }
          if ("${{ steps.recovery.outcome }}" -eq "failure") {
            Write-Host "::warning::Recovery suite had failures (advisory on hosted runners)"
          }
          if ($failed) { exit 1 }
