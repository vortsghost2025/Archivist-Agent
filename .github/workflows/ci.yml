name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies (if package.json exists)
        run: |
          if (Test-Path "package.json") { npm ci }

      - name: Run pre‑commit style checks
        run: |
          pwsh ./scripts/pre-commit.ps1

      - name: Run health check
        run: node ./scripts/health-check.js

      - name: Run schema validation (all lanes)
        run: node ./scripts/validate-schema.js --all

      - name: Run sample pre‑send validation
        run: |
          $msg = '{"schema_version":"1.3","task_id":"test-123","idempotency_key":"test-123","from":"archivist","to":"swarmmind","type":"notification","task_kind":"proposal","priority":"P2","subject":"Health Test","body":"Testing pre‑send validation","timestamp":"$(Get-Date -Format o)","requires_action":false}'
          $msgPath = "./temp-test-message.json"
          Set-Content -Path $msgPath -Value $msg -Encoding utf8
          node ./scripts/pre-send-validator.js $msgPath

      - name: Sync all lanes (ensure script propagation)
        run: node ./scripts/sync-all-lanes.js
