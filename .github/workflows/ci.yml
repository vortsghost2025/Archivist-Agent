name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check (governance scripts)
        if: hashFiles('tsconfig.ci.json') != ''
        run: npx tsc -p tsconfig.ci.json --noEmit

      - name: TypeScript type-check advisory (tsconfig.ci.json missing)
        if: hashFiles('tsconfig.ci.json') == ''
        run: |
          Write-Host "::warning::tsconfig.ci.json not found on this branch. TypeScript baseline check skipped. Feature validation continues below."
          Write-Host "TypeScript check is advisory until tsconfig.ci.json is added to master."

      - name: Run recovery test suite
        run: node ./scripts/recovery-test-suite.js

      - name: Run health check
        run: node ./scripts/health-check.js

      - name: Run schema validation (all lanes)
        run: node ./scripts/validate-schema.js --all
